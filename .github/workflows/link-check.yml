name: Link check
on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: check
        run: node scripts/check-links.js
      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HAS_PROBLEMS: ${{ steps.check.outputs.has_problems }}
        run: |
          existing=$(gh issue list --label link-check --state open --json number --jq '.[0].number // empty')
          if [ "$HAS_PROBLEMS" = "true" ]; then
            gh label create link-check --description "Weekly offer link check" --color fbca04 2>/dev/null || true
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --body-file link-report.md
            else
              gh issue create --title "Offer links need review" --label link-check --body-file link-report.md
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Latest weekly check found no broken or moved links."
          fi