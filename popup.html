<!doctype html>
<html lang="en" data-theme="light">
<head>
  <title>Kaltas</title>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
<link rel="stylesheet" href="fonts/inter.css">
</head>
<body>
  <header>
    <div class="brand-row">
      <div class="brand-mark">
        <img src="icons/logo-header.png" alt="">
      </div>
      <div>
        <h1>Kaltas</h1>
      </div>
      <button id="settings-btn" class="settings-btn" type="button" aria-label="Settings" aria-expanded="false" aria-controls="settings-panel"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 5h2.2M7.8 5H14M2 11h6.2M11.8 11H14"/><circle cx="6" cy="5" r="1.8"/><circle cx="10" cy="11" r="1.8"/></svg></button>
    </div>
        <div id="settings-panel" class="settings-panel" hidden>
      <button id="theme-toggle" class="theme-toggle settings-item" type="button" aria-label="Enable dark mode" aria-pressed="false">
        <span class="theme-label">Dark mode</span>
        <span class="theme-switch" aria-hidden="true"><span></span></span>
      </button>
      <button id="footer-toggle" class="theme-toggle settings-item" type="button" aria-pressed="false"><span class="theme-label">Hide footer</span><span class="theme-switch" aria-hidden="true"><span></span></span></button>
    </div>
    <p id="site" class="site-line"></p>
  </header>

  <section id="matches" aria-live="polite"></section>

  <details id="browse">
    <summary><span>Browse student deals</span><span class="summary-count" aria-hidden="true"></span></summary>
    <label class="search-label" for="search">Find student deals</label>
    <input id="search" type="search" placeholder="Search" aria-label="Search student deals">
    <ul id="all"></ul>
  </details>

  <footer>
    <div class="footer-divider" aria-hidden="true"></div>
    
    <p class="footer-credit"><span>Developed by <span class="credit-star" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 1.5l2.1 4.1 4.4.6-3.2 3.2.7 4.5L8 11.8l-4 2.1.7-4.5L1.5 6.2l4.4-.6z"/></svg></span> <a class="credit-author" href="https://miconavarro.vercel.app" target="_blank" rel="noopener noreferrer">Mico Gerard Navarro</a></span></p>
    <nav class="footer-links" aria-label="Kaltas links">
      <a class="rate-link" href="https://chromewebstore.google.com/detail/kaltas-find-student-deals/ghmgacjeikbkciknkcldfkpiiclfaeik/reviews?utm_source=item-share-cb" target="_blank" rel="noopener noreferrer" aria-label="Rate Kaltas on the Chrome Web Store" title="Rate Kaltas">Rate</a>
      <a href="https://miconavarro.vercel.app/kaltas/privacy-policy" target="_blank" rel="noopener noreferrer">Privacy</a>
      <a href="https://github.com/miconvr/kaltas/issues" target="_blank" rel="noopener noreferrer">Report</a>
    </nav>
  </footer>
  <script src="offers-loader.js"></script><script src="popup.js"></script>
</body>
</html>
